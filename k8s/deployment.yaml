apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      initContainers:
        - name: initialize-storage
          image: busybox:1.36
          command: ["sh", "-c", "touch /storage/tasks.db"]
          volumeMounts:
            - name: task-storage
              mountPath: /storage
      containers:
        - name: task-app
          image: devops-capstone-web:latest
          envFrom:
            - configMapRef:
                name: task-app-config
            - secretRef:
                name: task-app-secret
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: task-storage
              mountPath: /app/tasks.db
              subPath: tasks.db
      volumes:
        - name: task-storage
          persistentVolumeClaim:
            claimName: task-db-pvc
