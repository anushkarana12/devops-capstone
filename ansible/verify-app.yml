---
- name: Verify DevOps Capstone Application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check Kubernetes node
      command: kubectl get nodes
      changed_when: false

    - name: Check application deployment
      command: kubectl get deployment task-app
      changed_when: false

    - name: Check persistent storage
      command: kubectl get pvc task-db-pvc
      changed_when: false

    - name: Check application API
      uri:
        url: http://127.0.0.1:8081/api/tasks
        method: GET
        status_code: 200
      register: api_result

    - name: Display API verification
      debug:
        var: api_result.json
