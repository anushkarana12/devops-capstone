---
- name: Verify DevOps Capstone Application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check Kubernetes node
      command: kubectl get nodes
      changed_when: false

    - name: Check application deployment
      command: kubectl get deployment task-app
      changed_when: false

    - name: Check persistent storage
      command: kubectl get pvc task-db-pvc
      changed_when: false

    - name: Verify API authentication protection
      uri:
        url: http://127.0.0.1:8081/api/tasks
        method: GET
        follow_redirects: none
        status_code: 302
      register: api_result

    - name: Confirm API authentication protection
      assert:
        that:
          - api_result.status == 302
        success_msg: "API correctly redirects unauthenticated requests."
